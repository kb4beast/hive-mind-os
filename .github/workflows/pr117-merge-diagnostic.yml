name: PR 117 Merge Diagnostic

on:
  push:
    branches:
      - codex/phase8-exact-candidate-verification
    paths:
      - .github/workflows/pr117-merge-diagnostic.yml

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    steps:
      - name: Checkout branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Reproduce historical Phase-12 receipts on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = '9efe64b80b4bf7b50c7bcf20e9aef5acb8fc55a7'
          $candidateRoot = Join-Path $env:RUNNER_TEMP 'pr117-candidate'
          $logRoot = Join-Path $env:RUNNER_TEMP 'reproduced-logs'
          git worktree add --detach $candidateRoot $candidate
          Set-Location $candidateRoot
          python -m pip install --disable-pip-version-check --no-deps -e . | Out-Null
          New-Item -ItemType Directory -Force -Path $logRoot | Out-Null

          $results = @{}
          $parity = Join-Path $logRoot 'phase11-parity.log'
          & python -m unittest tests.test_cli_enqueue.EnqueueCliTests.test_enqueue_pins_and_deduplicates_semantic_work -v *> $parity
          $results['phase11-parity'] = $LASTEXITCODE

          $rollback = Join-Path $logRoot 'phase11-rollback.log'
          & python -m unittest tests.test_cli_enqueue.EnqueueCliTests.test_legacy_rollback_mode_reuses_the_existing_job_without_kernel_writes -v *> $rollback
          $results['phase11-rollback'] = $LASTEXITCODE

          $security = Join-Path $logRoot 'security-regression.log'
          & python -m unittest tests.test_brain_kernel_authority tests.test_brain_kernel_local_execution tests.test_sandbox -v *> $security
          $results['security-regression'] = $LASTEXITCODE

          $recovery = Join-Path $logRoot 'recovery-regression.log'
          & python -m unittest discover -s tests -p test_workers.py -v *> $recovery
          $results['recovery-regression'] = $LASTEXITCODE

          Write-Host '=== reproduced transcript status and digests ==='
          foreach ($path in Get-ChildItem $logRoot -Filter '*.log' | Sort-Object Name) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($path.Name)
            $digest = (Get-FileHash -Algorithm SHA256 $path.FullName).Hash.ToLowerInvariant()
            Write-Host "$name exit=$($results[$name]) sha256:$digest"
            Write-Host "--- $($path.Name) tail ---"
            Get-Content $path.FullName | Select-Object -Last 8
          }

          if ($results.Values | Where-Object { $_ -ne 0 }) {
            throw 'one or more historical receipt commands failed'
          }
      - name: Show Ruff fixes without modifying branch
        if: always()
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        continue-on-error: true
        with:
          version: '0.16.0'
          args: 'check --fix --diff examples/verify-an-agent-change/repository/check_discount.py examples/verify-an-agent-change/run_example.py'
