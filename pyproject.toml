[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-mind-os"
version = "0.6.0"
description = "An evidence-driven operating system for autonomous specialist agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hive Mind OS contributors" }]
dependencies = []

[project.scripts]
hive-mind = "hive_mind_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hive_mind_os = [
    "schemas/*.json",
    "foundation/schemas/*.json",
    "foundation/generated/*.json",
    "foundation/generated/agents/*.json",
    "builtin_packages/*/*.json",
    "builtin_packages/*/*/*.json",
    "builtin_packages/*/*/*/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
