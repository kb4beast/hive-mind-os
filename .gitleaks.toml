title = "Hive Mind OS secret-scanning policy"

[extend]
useDefault = true

[allowlist]
description = "Synthetic test identifiers retained in PR history; exact line-level false positives only"
regexTarget = "line"
regexes = [
  '''IDEMPOTENCY-P06-test''',
  '''ConstraintEnvelope\("AUTH-(?:one|parent|child)", "MISSION-phase-1"''',
  # Synthetic identifiers in a retained audit probe transcript, kept verbatim as
  # evidence. generic-api-key fires on the adjacency, not on any credential.
  '''"AUTH-probe2", "MISSION-probe2", "WORK-probe2"''',
]
