phase: "Phase 2 — Build the general autonomous mission loop"
workstream: "Typed bounded repository mission loop"
base_sha: "064222e6b04835a5f4257318b7045b7848e06bab"
status: "BLOCKED"
objective: >-
  Replace the fixed repository fixture lifecycle with a deterministic,
  revision-bound mission state machine that separates role proposals from policy,
  isolated execution, receipts, remands, and independent immutable verification.
implementation_scope:
  - "MissionState, WorkItemState, MissionEvent, and deterministic transition reducer"
  - "Intake validation and Orchestrator risk-lane, role, budget, rollback, and human-gate planning"
  - "Read-only Explorer actions with prompt-injection-as-data handling"
  - "Architect design artifact validation with alternatives, invariants, threats, rollback, and acceptance mapping"
  - "Iterative Builder actions in a fresh no-hardlink local Git workspace"
  - "Curator remand/adopt decisions through the Phase 1 immutable verifier"
  - "Atomic self-verifying local mission bundle; no remote delivery operation exists"
  - "Receipted model-provider action adapter whose digest-only attempts are independently policy-checked before Builder action execution"
  - "Reject-then-correct model-action fixtures for Node/TypeScript, C#, monorepo, no-test, green-suite hidden-defect, and misleading-README repositories"
acceptance_tests:
  - "tests.test_mission_loop.MissionStateReducerTests"
  - "tests.test_mission_loop.OrchestratorTests"
  - "tests.test_mission_loop.MissionLoopAdversarialTests"
  - "tests.test_mission_loop_provider.ModelProviderActionAdapterTests"
tests_actually_run:
  - >-
    PYTHONPATH=src python -m unittest tests.test_mission_loop
    tests.test_mission_loop_provider -v
    (20 passed; focused Phase 2 smoke test)
tests_not_run:
  - "Repository-wide unittest gate, per user instruction to smoke-test only touched work"
  - "Independent clean Linux and macOS Phase 1 reproduction"
  - "A real credentialed/provider-funded model action run; the covered provider attempts use test transports only"
  - "A C# compiler/runtime execution; the C# command family is covered through a constrained local dotnet-compatible fixture because this host has no dotnet SDK"
  - "Repository-wide lint, type, packaging, security, and cross-platform sweeps, per user instruction"
files_changed:
  - "src/hive_mind_os/mission_loop.py"
  - "src/hive_mind_os/model_action_adapter.py"
  - "src/hive_mind_os/roles.py"
  - "src/hive_mind_os/sandbox.py"
  - "src/hive_mind_os/verify.py"
  - "src/hive_mind_os/__init__.py"
  - "tests/test_mission_loop.py"
  - "tests/test_mission_loop_provider.py"
behavior_added:
  - "Stale and illegal mission transitions fail closed before execution"
  - "Explorer cannot write, commit, push, alter acceptance, or treat repository text as authority"
  - "Builder rejects malformed, unknown, duplicate, sealed-test, out-of-scope, and dependency-changing actions"
  - "Failed Builder test attempts remain in receipts and may be corrected in a later bounded turn"
  - "Curator receives the exact candidate and sealed specifications through a fresh Phase 1 verification materialization"
  - "Curator remands append a new Builder work item; prior history is not rewritten"
  - "Published bundles hash every mission artifact and self-verify before atomic rename"
  - "A model provider can only propose exact JSON actions or an explicit refusal; prompt/response bodies never enter public mission receipts"
  - "Provider retry index, model refusal, timeout, request/response digests, token metadata, and action digest are retained as Builder receipts before any proposed action is executed"
  - "Equivalent bounded reject-then-correct scenarios cover Node/TypeScript, C# command shape, monorepo path confinement, no-test sealed validation, green visible tests with a failing hidden probe, and misleading README guidance"
authority_added: "Local, isolated candidate commits only"
authority_not_added:
  - "No push, pull-request creation, merge, auto-merge, deployment, credential, spending, or real-provider network authority"
  - "No mutation of the original objective, sealed acceptance specifications, policy, or live caller worktree"
receipts:
  - "Focused adversarial integration test creates Phase 1 Curator bundles and verifies their candidate commit/tree bindings."
  - "Focused provider-action tests retain digest-only provider attempts and verify that retry, refusal, and timeout cannot cause unvalidated Builder effects."
  - "The Node/TypeScript scenario exercises the sealed verifier with Node type stripping; the C# scenario exercises the dotnet command family through a controlled local fixture, not an installed SDK."
  - "The test teardown removes its temporary fixture artifacts; this checkpoint records the observed command and result, not a fabricated durable receipt path."
development_failures_preserved:
  - >-
    Early red test runs exposed invalid action transitions consuming role state,
    missing failed-command blockers, unsupported local candidate checkpoints, and
    a missing Curator output parent. The tests and implementation were corrected;
    no test or acceptance rule was weakened.
known_failures:
  - >-
    Phase 1's completed repository gate remains unclassified: 18 failures and 42
    errors across benchmark, experiment, GitHub, mission, mission-store, point-in-time,
    projection, governance, and policy-invariant suites. This workstream did not alter
    those tests or claim they are baseline failures.
unresolved_dissent: >-
  The bounded model-provider action adapter and all requested repository-family
  fixtures are exercised locally, but no real credentialed/provider-funded call,
  C# compiler run, independent reproduction, durable worker path, or complete
  repository gate has been demonstrated. Phase 2 must not be represented as
  exit-gate complete.
rollback: >-
  Revert the commits after 064222e6b04835a5f4257318b7045b7848e06bab that add
  mission_loop.py, the model action adapter, the Windows verifier-environment
  compatibility adjustment, public exports, and focused tests. This removes the
  Phase 2 API while leaving the Phase 1 verifier unchanged.
human_gates:
  - "High and critical risk plans cannot complete automatically; they retain explicit external Steward and human authority gates."
  - "Do not promote Phase 1 or Phase 2 while their independent reproduction and scenario obligations remain open."
next_exact_action: >-
  Independently reproduce the Phase 1 bundle on clean Linux and macOS, run an
  actual C# compiler/runtime scenario on a host with the required SDK, and classify
  the existing full-gate failures against unchanged main before any promotion. Do
  not make a credentialed/provider-funded call without owner authority.
