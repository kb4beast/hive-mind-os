name: Autopilot Control Room

on:
  pull_request:
    paths:
      - ".autopilot/**"
      - ".github/workflows/autopilot-control-room.yml"
      - "docs/execution/**"
      - "USER_GUIDE/**"
      - "ORIGINAL_PLAN.md"
  push:
    branches: [main]
    paths:
      - ".autopilot/**"
      - ".github/workflows/autopilot-control-room.yml"
      - "docs/execution/**"
      - "USER_GUIDE/**"
      - "ORIGINAL_PLAN.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-contract:
    name: autopilot-controller-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile deterministic controller
        run: python -m compileall -q .autopilot/bin .autopilot/tests
      - name: Run control-plane tests
        run: python -m unittest discover -s .autopilot/tests -v
      - name: Run bootstrap doctor
        run: python .autopilot/bin/autopilot.py --repo-root . doctor --json
