name: Export exact source bundle

on:
  push:
    branches:
      - agent/version-1.1-release-hardening

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build verified Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git branch export-source "$GITHUB_SHA"
          git bundle create hive-mind-os-release.bundle export-source
          git bundle verify hive-mind-os-release.bundle
          printf '%s\n' "$GITHUB_SHA" > bundle-head.txt
          git show -s --format=fuller "$GITHUB_SHA" > bundle-commit.txt
      - name: Upload exact source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-mind-os-release-source-bundle
          path: |
            hive-mind-os-release.bundle
            bundle-head.txt
            bundle-commit.txt
          if-no-files-found: error
          retention-days: 1
