name: Bootstrap Autopilot Policy And Controller Fix

on:
  push:
    branches:
      - agent/bootstrap-autopilot-control-plane

permissions:
  contents: write

jobs:
  expand:
    name: install-chatgpt-first-policy-and-controller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reconstruct verified update
        shell: bash
        run: |
          set -euo pipefail
          cat .autopilot/update-payload/part{00..04} | base64 -d > /tmp/update.tar.xz
          echo "c759ef8d312418e6ef83de08123b421d7f9bf511fdaa17b3959a0d6e65946049  /tmp/update.tar.xz" | sha256sum -c -
          tar -xJf /tmp/update.tar.xz -C .
          rm -rf .autopilot/update-payload
      - name: Validate control plane
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .autopilot/bin .autopilot/tests
          python -m unittest discover -s .autopilot/tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.autopilot').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Commit corrected control plane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hive Mind bootstrap"
          git config user.email "hive-mind-bootstrap@users.noreply.github.com"
          git add -A
          git add -f .autopilot/bin/*.py
          git diff --cached --check
          git commit -m "chore: enforce ChatGPT-first node workflow"
      - name: Run repository-aware doctor
        shell: bash
        run: |
          set -euo pipefail
          python .autopilot/bin/autopilot.py --repo-root . doctor --json
      - name: Push corrected source
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
