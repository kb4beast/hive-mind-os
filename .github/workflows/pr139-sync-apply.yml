name: PR139 Apply Singleton Base Synchronization

on:
  push:
    branches:
      - release/hive-mind-os-singleton-20260811-r4

permissions:
  contents: write

jobs:
  merge-current-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR139 head with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed ancestry-preserving synchronization
        shell: bash
        run: python .github/scripts/pr139_sync_apply.py
