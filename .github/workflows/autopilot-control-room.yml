name: Bootstrap Autopilot Control Plane

on:
  push:
    branches:
      - agent/bootstrap-autopilot-control-plane

permissions:
  contents: write

jobs:
  expand:
    name: expand-validated-autopilot-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify package
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:.github/workflows/autopilot-control-room.yml > /tmp/bootstrap-workflow.yml
          cat .autopilot/bootstrap-payload/part{00..12} > /tmp/bootstrap-prefix
          cat .autopilot/bootstrap-payload/part13hex{0..5} | xxd -r -p > /tmp/bootstrap-part13
          cat /tmp/bootstrap-prefix /tmp/bootstrap-part13 > /tmp/bootstrap.tar.xz
          echo "56488f869fa76895088ffbc5da2effc2f5ee2f8a2b4b90d2b35876375b9937bd  /tmp/bootstrap.tar.xz" | sha256sum -c -
          tar -xJf /tmp/bootstrap.tar.xz -C .
          install -m 0644 /tmp/bootstrap-workflow.yml .github/workflows/autopilot-control-room.yml
          rm -rf .autopilot/bootstrap-payload
          test ! -e REPO_ROOT

      - name: Validate expanded control plane
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .autopilot/bin .autopilot/tests
          python -m unittest discover -s .autopilot/tests -v

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hive Mind bootstrap"
          git config user.email "hive-mind-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "chore: install autonomy implementation control plane"

      - name: Run repository-aware doctor
        shell: bash
        run: |
          set -euo pipefail
          python .autopilot/bin/autopilot.py --repo-root . doctor --json

      - name: Push expanded source
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
