name: Apply reviewed Phase 5A candidate

on:
  push:
    branches:
      - agent/phase5a-orchestrator-shadow
    paths:
      - .github/bootstrap/phase5a-final.ready
      - .github/workflows/export-phase5a-source.yml
  pull_request:
    branches:
      - release/version_1.1
    paths:
      - .github/bootstrap/phase5a-final.ready
      - .github/workflows/export-phase5a-source.yml

permissions:
  contents: write

concurrency:
  group: phase5a-reviewed-publication
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase5a-orchestrator-shadow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Phase 5A branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase5a-orchestrator-shadow
          fetch-depth: 0
          persist-credentials: true
      - name: Apply the reviewed non-workflow tree once
        shell: bash
        run: |
          set -euo pipefail
          sentinel=.github/bootstrap/phase5a-final.ready
          chunks=(
            .github/bootstrap/phase5a-final.part-00
            .github/bootstrap/phase5a-final.part-01
            .github/bootstrap/phase5a-final.part-02
            .github/bootstrap/phase5a-final.part-03
            .github/bootstrap/phase5a-final.part-04
            .github/bootstrap/phase5a-final.part-05
            .github/bootstrap/phase5a-final.part-06
            .github/bootstrap/phase5a-final.part-07
          )
          if [[ ! -f "$sentinel" ]]; then
            echo 'reviewed Phase 5A payload already applied'
            exit 0
          fi
          for chunk in "${chunks[@]}"; do
            test -f "$chunk"
          done
          cat > /tmp/phase5a-chunks.sha256 <<'EOF'
          f20ac05a5902af4b40db101a2618a0c051cb2160ba4afc1cb2cb2f962cb17dd0  .github/bootstrap/phase5a-final.part-00
          c7a4794a3151b8191584955f83b5b76814181fb96fc29caae37be6f6b7038d1d  .github/bootstrap/phase5a-final.part-01
          945b1e448d473e5a08143bf6114c878dc9826ee0235c9e31403c48afe42466da  .github/bootstrap/phase5a-final.part-02
          2ef3aecabd28b6706c71412cb743f65b1479a9691f6b09383291d4d9000da7fa  .github/bootstrap/phase5a-final.part-03
          703fcb929417b59d96457be721413d6f1f304cbfe356d4cf9ec96a2c89ab20a0  .github/bootstrap/phase5a-final.part-04
          84799a97de0cb987fba15930c12fc7e6dd194dd7edc06189f3b3cc8d1d43deb1  .github/bootstrap/phase5a-final.part-05
          d47217d611665626234f62f5d5c975753febc6476605a6428ea27f6065a10c2b  .github/bootstrap/phase5a-final.part-06
          1c255f381e97a133dff134e502ac08e223934c0379ae35a8728bcc7d6d667746  .github/bootstrap/phase5a-final.part-07
          EOF
          sha256sum --check --strict /tmp/phase5a-chunks.sha256
          cat "${chunks[@]}" > /tmp/phase5a-final.patch.gz.b64
          echo '30684561939d353639c4b3e1c0b0afe5b985428180981506a45efaec5d718409  /tmp/phase5a-final.patch.gz.b64' \
            | sha256sum --check --strict
          base64 --decode /tmp/phase5a-final.patch.gz.b64 \
            | gzip --decompress > /tmp/phase5a-final.patch
          echo '35ac3a56f21b9ab943fbef7b9c62b5cde6dcf86a9346691074dd469298d6c802  /tmp/phase5a-final.patch' \
            | sha256sum --check --strict
          git apply --check --index /tmp/phase5a-final.patch
          git apply --index /tmp/phase5a-final.patch
          git rm "${chunks[@]}" "$sentinel"
          git diff --cached --check
          git config user.name 'kb4beast'
          git config user.email '14246027+kb4beast@users.noreply.github.com'
          git commit -m 'Publish reviewed Phase 5A Orchestrator candidate'
          git push origin HEAD:refs/heads/agent/phase5a-orchestrator-shadow
