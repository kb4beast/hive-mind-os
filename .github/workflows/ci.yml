name: Constitutional CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact local package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Compile bytecode
        run: python -m compileall -q src tests
      - name: Run deterministic test suite
        run: python -m unittest discover -s tests -v

  quality:
    name: static-and-type-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruff static checks
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: "check src tests"
      - name: Pyright type checks
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2
        with:
          version: "1.1.411"

  codeql:
    name: codeql-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: dependency-and-license-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject vulnerable or disallowed dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  build-evidence:
    name: sbom-and-build-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel without project dependencies
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .
      - name: Verify installed wheel resources
        run: |
          python -m pip install --disable-pip-version-check --no-deps --target .wheel-install dist/*.whl
          PYTHONPATH=.wheel-install python scripts/verify_installed_wheel.py \
            --source-root src/hive_mind_os \
            --installed-root .wheel-install
      - name: Install checksum-pinned Syft
        run: |
          curl --fail --show-error --silent --location \
            --output /tmp/syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz
          echo "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788  /tmp/syft.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/syft.tar.gz --directory /tmp syft
          /tmp/syft version
      - name: Generate and verify SPDX JSON SBOM
        run: |
          /tmp/syft scan dir:.wheel-install \
            --source-name hive-mind-os-wheel-install \
            --source-version 0.6.0 \
            --output spdx-json=dist/hive-mind-os.spdx.json
          PYTHONPATH=.wheel-install python - <<'PY'
          import importlib.metadata
          import json
          import re
          from pathlib import Path

          sbom_path = Path("dist/hive-mind-os.spdx.json")
          if not sbom_path.is_file() or sbom_path.stat().st_size == 0:
              raise SystemExit("SBOM is missing or empty")
          sbom = json.loads(sbom_path.read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("SBOM is not SPDX 2.3 JSON")
          distribution = importlib.metadata.distribution("hive-mind-os")
          normalize = lambda value: re.sub(r"[-_.]+", "-", value).lower()
          expected = (normalize(distribution.metadata["Name"]), distribution.version)
          packages = sbom.get("packages")
          if not isinstance(packages, list) or not packages:
              raise SystemExit("SBOM contains no packages")
          discovered = {
              (normalize(package.get("name", "")), package.get("versionInfo"))
              for package in packages
              if isinstance(package, dict)
          }
          if expected not in discovered:
              raise SystemExit(
                  f"SBOM does not identify installed distribution {expected!r}"
              )
          print(
              f"verified {len(packages)} SBOM package(s), including "
              f"{distribution.metadata['Name']}=={distribution.version}"
          )
          PY
      - name: Upload immutable build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-mind-os-build-evidence
          path: |
            dist/*.whl
            dist/hive-mind-os.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest wheel and SBOM provenance
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/hive-mind-os.spdx.json
