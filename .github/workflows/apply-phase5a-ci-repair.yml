name: Apply reviewed Phase 5A CI repair

on:
  push:
    branches:
      - agent/phase5a-orchestrator-shadow
    paths:
      - .github/bootstrap/phase5a-ci-repair.ready
  pull_request:
    branches:
      - release/version_1.1
    paths:
      - .github/bootstrap/phase5a-ci-repair.ready

permissions:
  contents: write

concurrency:
  group: phase5a-ci-repair-publication
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase5a-orchestrator-shadow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Phase 5A branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase5a-orchestrator-shadow
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed Ruff repair once
        shell: bash
        run: |
          set -euo pipefail
          sentinel=.github/bootstrap/phase5a-ci-repair.ready
          chunks=(
            .github/bootstrap/phase5a-ci-repair.part-00
            .github/bootstrap/phase5a-ci-repair.part-01
            .github/bootstrap/phase5a-ci-repair.part-02
            .github/bootstrap/phase5a-ci-repair.part-03
            .github/bootstrap/phase5a-ci-repair.part-04
          )
          if [[ ! -f "$sentinel" ]]; then
            echo 'reviewed Phase 5A CI repair already applied'
            exit 0
          fi
          for chunk in "${chunks[@]}"; do
            test -f "$chunk"
          done
          cat > /tmp/phase5a-ci-repair-chunks.sha256 <<'EOF'
          258511a2edee93c93816add20cce4b59d41633b65197b37bc602928ea028bca9  .github/bootstrap/phase5a-ci-repair.part-00
          129f20d9462a8501e52e50febb76d554d56c7f78f540bbf0596d8306e792a375  .github/bootstrap/phase5a-ci-repair.part-01
          821124809855be5c91d90a4629cb41cd49169c0c174ef054e1f9fef5315c4ddf  .github/bootstrap/phase5a-ci-repair.part-02
          1a8e9f5bc36b66a558a833489c803ba5271f80a7c61f4798ec7149a6d5aeca46  .github/bootstrap/phase5a-ci-repair.part-03
          25532a5a1a6ced3300918e4ffb67982c0c835a3e0f9a2a5c3dcd8c0d94135bc1  .github/bootstrap/phase5a-ci-repair.part-04
          EOF
          sha256sum --check --strict /tmp/phase5a-ci-repair-chunks.sha256
          cat "${chunks[@]}" > /tmp/phase5a-ci-repair.patch.gz.b64
          echo '1937f1f87d1ff4f20752cc87af42bb046ba206f32ffa139705f33c83d8817d1c  /tmp/phase5a-ci-repair.patch.gz.b64' \
            | sha256sum --check --strict
          base64 --decode /tmp/phase5a-ci-repair.patch.gz.b64 \
            | gzip --decompress > /tmp/phase5a-ci-repair.patch
          echo '0cca68afe08d8d74913e428ab178bf0dcfbc37554825e8f1fa46aee959c84848  /tmp/phase5a-ci-repair.patch' \
            | sha256sum --check --strict
          git apply --check --index /tmp/phase5a-ci-repair.patch
          git apply --index /tmp/phase5a-ci-repair.patch
          git rm "${chunks[@]}" "$sentinel"
          git diff --cached --check
          git config user.name 'kb4beast'
          git config user.email '14246027+kb4beast@users.noreply.github.com'
          git commit -m 'Repair hosted Ruff static gate'
          git push origin HEAD:refs/heads/agent/phase5a-orchestrator-shadow
