[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-mind-os"
version = "0.3.0"
description = "An evidence-driven operating system for autonomous specialist agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hive Mind OS contributors" }]
dependencies = []

[project.scripts]
hive-mind = "hive_mind_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
