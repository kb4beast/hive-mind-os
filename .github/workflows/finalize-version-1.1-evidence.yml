name: Finalize Version 1.1 evidence

on:
  push:
    branches:
      - agent/version-1.1-release-hardening
    paths:
      - .github/bootstrap/version-1.1-final-evidence.patch.gz.b64
      - .github/workflows/finalize-version-1.1-evidence.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/bootstrap/version-1.1-final-evidence.patch.gz.b64
      - .github/workflows/finalize-version-1.1-evidence.yml

permissions:
  contents: write

concurrency:
  group: version-1.1-final-evidence
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/version-1.1-release-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hardening branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/version-1.1-release-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Apply verified non-workflow evidence delta once
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/bootstrap/version-1.1-final-evidence.patch.gz.b64
          if [[ ! -f "$payload" ]]; then
            echo 'verified final evidence payload already applied'
            exit 0
          fi
          echo "1f47c83fabc770088ab8436b461429ca0d561945e0f9519c45b6ca0aca27e6a0  $payload" \
            | sha256sum --check --strict
          base64 --decode "$payload" | gzip --decompress > /tmp/version-1.1-final-evidence.patch
          echo "929c096c7293eb1cc18d62fa4fa580140a07481176ec5ceb949ff1277630a521  /tmp/version-1.1-final-evidence.patch" \
            | sha256sum --check --strict
          git apply --check --index /tmp/version-1.1-final-evidence.patch
          git apply --index /tmp/version-1.1-final-evidence.patch
          git rm "$payload"
          git config user.name "kb4beast"
          git config user.email "14246027+kb4beast@users.noreply.github.com"
          git commit -m "Seal version 1.1 exact integration evidence"
          git push origin HEAD:refs/heads/agent/version-1.1-release-hardening
