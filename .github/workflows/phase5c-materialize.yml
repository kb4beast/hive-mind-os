name: Phase 5C materialize validated candidate

on:
  push:
    branches:
      - agent/phase5c-builder-shadow
    paths:
      - .phase5c/**
      - .github/workflows/phase5c-materialize.yml

permissions:
  contents: write

concurrency:
  group: phase5c-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact bootstrap head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Verify segments and reconstruct archive
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase5c-segments.sha256 <<'EOF'
          4d00022f19129a7a9db88a63f683d2af73727585d5bb82c51b0bf6608587cade  .phase5c/chunk-00
          c867609ce9de730b7903771395076a5b7a9bbbd20e14f42306934af55d07ada6  .phase5c/chunk-01
          c93b5ac7f6b1bd49ded01ba692e119a8fe1ef2dc7da97240585d410fd9045872  .phase5c/chunk-02
          a0dfb48dec091efe9113d0b7d51c4b785795ad14bb0d8a65e751acaead1e2d6c  .phase5c/chunk-03
          114a0de321b58398c525b8b02c66385af9bad62133e6d205d5872bc4dc77b469  .phase5c/chunk-04
          a8b1f65697c88d9555d9ad8549a575cf8025fe8f77f2f61bf908f069db2fa100  .phase5c/chunk-05
          EOF
          sha256sum --check /tmp/phase5c-segments.sha256
          cat .phase5c/chunk-* | base64 --decode > /tmp/phase5c-files.tar.gz
          printf '%s  %s\n' \
            '24ff538803734ddbd65ca55c74615d10d6417ebfaa5b6012f4e8275d4222a6e2' \
            '/tmp/phase5c-files.tar.gz' | sha256sum --check

      - name: Verify archive allowlist
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase5c-expected.txt <<'EOF'
          .github/workflows/ci.yml
          docs/architecture/ADR-035-BUILDER-DEEP-PLAYBOOK.md
          docs/architecture/ADR_INDEX.md
          docs/architecture/PHASE5C_BUILDER_CONTRACT.md
          docs/architecture/PHASE5C_MIGRATION_AND_ROLLBACK.md
          evidence/courts/phase5c-builder-playbook-court.md
          evidence/phase5a/phase5a_orchestrator_inventory.json
          evidence/phase5b/phase5b_architect_inventory.json
          evidence/phase5c/PHASE5C_AUDIT_LEDGER.md
          evidence/phase5c/PHASE5C_DISSENT.md
          evidence/phase5c/PHASE5C_INSTALLED_WHEEL_RECEIPT.md
          evidence/phase5c/phase5c_builder_inventory.json
          evidence/phase5c/procedural-role-review.json
          evidence/sources/PHASE5C_BUILDER_SOURCE_REGISTER.md
          scripts/phase5b_architect_inventory.py
          scripts/phase5c_builder_inventory.py
          scripts/verify_phase5c_installed_wheel.py
          src/hive_mind_os/foundation/builder_playbook.py
          src/hive_mind_os/foundation/builder_playbook_contracts.py
          tests/test_phase5c_builder_playbook.py
          EOF
          LC_ALL=C sort -o /tmp/phase5c-expected.txt /tmp/phase5c-expected.txt
          tar -tzf /tmp/phase5c-files.tar.gz > /tmp/phase5c-actual.txt
          if grep -E '(^/|(^|/)\.\.(/|$))' /tmp/phase5c-actual.txt; then
            echo 'unsafe archive path' >&2
            exit 1
          fi
          LC_ALL=C sort -o /tmp/phase5c-actual.txt /tmp/phase5c-actual.txt
          diff -u /tmp/phase5c-expected.txt /tmp/phase5c-actual.txt

      - name: Extract, verify candidate, and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/phase5c-files.tar.gz -C .
          rm -rf .phase5c .github/workflows/phase5c-materialize.yml
          git status --short
          git diff --name-only --diff-filter=ACMRT HEAD | LC_ALL=C sort > /tmp/phase5c-changed.txt
          git ls-files --others --exclude-standard | LC_ALL=C sort >> /tmp/phase5c-changed.txt
          LC_ALL=C sort -u -o /tmp/phase5c-changed.txt /tmp/phase5c-changed.txt
          diff -u /tmp/phase5c-expected.txt /tmp/phase5c-changed.txt
          python -m compileall -q src tests scripts
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_phase5c_builder_playbook.py' -v

      - name: Commit validated candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | LC_ALL=C sort | wc -l)" -eq 27
          git commit -m 'Materialize inert Phase 5C Builder candidate'
          git diff --name-only 43db53de7a41d9bc02e987776edc260594def4c8 HEAD \
            | LC_ALL=C sort > /tmp/phase5c-final.txt
          diff -u /tmp/phase5c-expected.txt /tmp/phase5c-final.txt
          git push origin HEAD:${{ github.ref_name }}
