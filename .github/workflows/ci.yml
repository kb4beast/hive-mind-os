name: Constitutional CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exact local package
        run: python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Compile bytecode
        run: python -m compileall -q src tests
      - name: Run deterministic test suite
        run: python -m unittest discover -s tests -v

  quality:
    name: static-and-type-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruff static checks
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: "check src tests scripts"
      - name: Pyright type checks
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2
        with:
          version: "1.1.411"

  codeql:
    name: codeql-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: dependency-and-license-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject vulnerable or disallowed dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  build-evidence:
    name: sbom-and-build-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout immutable workflow input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve exact distribution metadata
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(project["project"]["version"])
          PY
          )"
          test -n "$PACKAGE_VERSION"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
      - name: Audit Version 1.1 integration contract
        run: |
          python scripts/release_integration_audit.py \
            --output dist/release-version-1.1-audit.json
      - name: Build wheel without project dependencies
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .
      - name: Verify installed wheel resources
        run: |
          python -m pip install --disable-pip-version-check --no-deps --target .wheel-install dist/*.whl
          PYTHONPATH=.wheel-install python scripts/verify_installed_wheel.py \
            --source-root src/hive_mind_os \
            --installed-root .wheel-install
      - name: Verify installed Phase 5A Orchestrator
        run: |
          PYTHONPATH=.wheel-install python scripts/verify_phase5a_installed_wheel.py \
            --installed-root .wheel-install \
            --output dist/phase5a-installed-wheel.json
      - name: Verify installed Phase 5B Architect
        run: |
          PYTHONPATH=.wheel-install python scripts/verify_phase5b_installed_wheel.py \
            --installed-root .wheel-install \
            --output dist/phase5b-installed-wheel.json
      - name: Verify installed Phase 5C Builder
        run: |
          PYTHONPATH=.wheel-install python scripts/verify_phase5c_installed_wheel.py \
            --installed-root .wheel-install \
            --output dist/phase5c-installed-wheel.json
      - name: Install checksum-pinned Syft
        run: |
          curl --fail --show-error --silent --location \
            --output /tmp/syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz
          echo "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788  /tmp/syft.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/syft.tar.gz --directory /tmp syft
          /tmp/syft version
      - name: Generate and verify SPDX JSON SBOM
        run: |
          /tmp/syft scan dir:.wheel-install \
            --source-name hive-mind-os-wheel-install \
            --source-version "$PACKAGE_VERSION" \
            --output spdx-json=dist/hive-mind-os.spdx.json
          PYTHONPATH=.wheel-install python - <<'PY'
          import importlib.metadata
          import json
          import re
          from pathlib import Path

          sbom_path = Path("dist/hive-mind-os.spdx.json")
          if not sbom_path.is_file() or sbom_path.stat().st_size == 0:
              raise SystemExit("SBOM is missing or empty")
          sbom = json.loads(sbom_path.read_text(encoding="utf-8"))
          if sbom.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("SBOM is not SPDX 2.3 JSON")
          distribution = importlib.metadata.distribution("hive-mind-os")
          normalize = lambda value: re.sub(r"[-_.]+", "-", value).lower()
          expected = (normalize(distribution.metadata["Name"]), distribution.version)
          packages = sbom.get("packages")
          if not isinstance(packages, list) or not packages:
              raise SystemExit("SBOM contains no packages")
          discovered = {
              (normalize(package.get("name", "")), package.get("versionInfo"))
              for package in packages
              if isinstance(package, dict)
          }
          if expected not in discovered:
              raise SystemExit(
                  f"SBOM does not identify installed distribution {expected!r}"
              )
          print(
              f"verified {len(packages)} SBOM package(s), including "
              f"{distribution.metadata['Name']}=={distribution.version}"
          )
          PY
      - name: Upload immutable build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-mind-os-build-evidence
          path: |
            dist/*.whl
            dist/hive-mind-os.spdx.json
            dist/release-version-1.1-audit.json
            dist/phase5a-installed-wheel.json
            dist/phase5b-installed-wheel.json
            dist/phase5c-installed-wheel.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest wheel, SBOM, and release audit provenance
        if: github.event_name == 'push'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/hive-mind-os.spdx.json
            dist/release-version-1.1-audit.json
            dist/phase5a-installed-wheel.json
            dist/phase5b-installed-wheel.json
            dist/phase5c-installed-wheel.json

  phase5c-static-remand:
    name: phase5c-static-remand
    if: github.event_name == 'pull_request' && github.event.action == 'reopened' && github.actor != 'github-actions[bot]' && github.head_ref == 'agent/phase5c-builder-shadow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact Ruff remands and append evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          builder = Path('src/hive_mind_os/foundation/builder_playbook.py')
          text = builder.read_text(encoding='utf-8')
          old = '    artifact_ids = set(_unique_ids(artifacts, "artifact_id", "artifact"))\n'
          new = '    _unique_ids(artifacts, "artifact_id", "artifact")\n'
          if old not in text:
              raise SystemExit('expected F841 source line not found')
          builder.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          tests = Path('tests/test_phase5c_builder_playbook.py')
          text = tests.read_text(encoding='utf-8')
          replacements = {
              '        from hive_mind_os.foundation.architect_playbook_contracts import validate_architect\n':
                  '        from hive_mind_os.foundation.architect_playbook_contracts import (\n'
                  '            validate_architect,\n'
                  '        )\n',
              '        from hive_mind_os.foundation.orchestrator_playbook_contracts import validate_orchestrator\n':
                  '        from hive_mind_os.foundation.orchestrator_playbook_contracts import (\n'
                  '            validate_orchestrator,\n'
                  '        )\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected I001 import not found: {old!r}')
              text = text.replace(old, new, 1)
          tests.write_text(text, encoding='utf-8', newline='\n')
          PY

          if ! grep -q 'Hosted CI remand — exact head `b313fc7' evidence/courts/phase5c-builder-playbook-court.md; then
            cat >> evidence/courts/phase5c-builder-playbook-court.md <<'COURT'

## Hosted CI remand — exact head `b313fc7d06749feb36c52297d729f14a9a601638`

Constitutional CI run `30651452723` independently reproduced the focused Builder suite and
installed-wheel contract but remanded two static-check defects before Pyright could run:

1. `builder_playbook.py` retained the duplicate-artifact validation result in an unused local
   variable (`F841`); the fix preserves the validation call while removing the unused binding.
2. The Phase 5A/5B compatibility test used two unformatted long local import statements
   (`I001`); the fix formats those imports without changing behavior.

The original failure remains part of the append-only record. No test, contract, evidence, or
authority gate was weakened. A new exact head must pass Ruff, Pyright, the full Python matrix,
CodeQL, dependency/license review, wheel verification, SBOM, and build-evidence upload before
the procedural disposition is terminal.
COURT
          fi

          if ! grep -q 'Entry 5 — hosted static-check remand' evidence/phase5c/PHASE5C_AUDIT_LEDGER.md; then
            cat >> evidence/phase5c/PHASE5C_AUDIT_LEDGER.md <<'LEDGER'

## Entry 5 — hosted static-check remand

- Exact head: `b313fc7d06749feb36c52297d729f14a9a601638`.
- Constitutional CI run: `30651452723`.
- Passed before remand: secret scan; general, Phase 5A, Phase 5B, and Phase 5C installed-wheel
  verification; release integration audit; wheel build; SPDX 2.3 SBOM generation.
- Ruff remands: one unused local binding (`F841`) and one import-format finding (`I001`).
- Repair: preserve duplicate-artifact validation without retaining the unused set; format the
  local compatibility imports.
- Tests, contracts, authority restrictions, evidence requirements, and rollback requirements
  were not weakened.
- Pyright and the final exact-head terminal matrix remain pending on the repaired head.
LEDGER
          fi

          PYTHONPATH=src python scripts/phase5c_builder_inventory.py
          python -m compileall -q src tests scripts
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_phase5c_builder_playbook.py' -v
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/hive_mind_os/foundation/builder_playbook.py \
            tests/test_phase5c_builder_playbook.py \
            evidence/courts/phase5c-builder-playbook-court.md \
            evidence/phase5c/PHASE5C_AUDIT_LEDGER.md \
            evidence/phase5c/phase5c_builder_inventory.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'Repair Phase 5C static-check remands'
          git push origin HEAD:agent/phase5c-builder-shadow
