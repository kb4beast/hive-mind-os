name: Import exact post-merge repair branch

on:
  push:
    branches:
      - agent/post-merge-repair-import-20260812

permissions:
  contents: write

jobs:
  import:
    if: contains(github.event.head_commit.message, '[run-r5-import]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .post-merge-import/r5-00.b64 \
            .post-merge-import/r5-01.b64 \
            .post-merge-import/r5-02.b64 \
            .post-merge-import/r5-03a.b64 \
            .post-merge-import/r5-04.b64 \
            .post-merge-import/r5-05.b64 \
            .post-merge-import/r5-06.b64 \
            .post-merge-import/r5-07.b64 \
            | base64 -d > /tmp/r5.bundle
          echo "56d7c8c9a6f5b039f30871012cf3a1f3df972b9a15459b3d7faf3cb5f5c3e6eb  /tmp/r5.bundle" | sha256sum -c -
          git bundle verify /tmp/r5.bundle
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch /tmp/r5.bundle \
            refs/heads/release/hive-mind-os-singleton-20260812-r5:refs/heads/release/hive-mind-os-singleton-20260812-r5
          test "$(git rev-parse refs/heads/release/hive-mind-os-singleton-20260812-r5)" = "8a3443507cad57c5c693751d8bf962a7e4a6d054"
          git merge-base --is-ancestor \
            f1a5ae749ac5d9dd25d8c72a87d49a9d8a4ae86f \
            refs/heads/release/hive-mind-os-singleton-20260812-r5
          git merge-base --is-ancestor \
            2da4c4800e607cb7096af38f59f91989a9a18505 \
            refs/heads/release/hive-mind-os-singleton-20260812-r5
      - name: Publish exact branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin \
            refs/heads/release/hive-mind-os-singleton-20260812-r5:refs/heads/release/hive-mind-os-singleton-20260812-r5
