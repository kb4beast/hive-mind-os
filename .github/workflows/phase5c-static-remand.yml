name: Phase 5C apply static-check remand

on:
  pull_request:
    branches:
      - agent/phase5a-orchestrator-shadow
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/phase5c-builder-shadow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply exact Ruff remands and append evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          builder = root / 'src/hive_mind_os/foundation/builder_playbook.py'
          text = builder.read_text(encoding='utf-8')
          old = '    artifact_ids = set(_unique_ids(artifacts, "artifact_id", "artifact"))\n'
          new = '    _unique_ids(artifacts, "artifact_id", "artifact")\n'
          if old not in text:
              raise SystemExit('expected F841 source line not found')
          builder.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          tests = root / 'tests/test_phase5c_builder_playbook.py'
          text = tests.read_text(encoding='utf-8')
          replacements = {
              '        from hive_mind_os.foundation.architect_playbook_contracts import validate_architect\n':
                  '        from hive_mind_os.foundation.architect_playbook_contracts import (\n'
                  '            validate_architect,\n'
                  '        )\n',
              '        from hive_mind_os.foundation.orchestrator_playbook_contracts import validate_orchestrator\n':
                  '        from hive_mind_os.foundation.orchestrator_playbook_contracts import (\n'
                  '            validate_orchestrator,\n'
                  '        )\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected I001 import not found: {old!r}')
              text = text.replace(old, new, 1)
          tests.write_text(text, encoding='utf-8', newline='\n')

          court = root / 'evidence/courts/phase5c-builder-playbook-court.md'
          text = court.read_text(encoding='utf-8')
          marker = '## Hosted CI remand — exact head `b313fc7d06749feb36c52297d729f14a9a601638`'
          addition = '''

## Hosted CI remand — exact head `b313fc7d06749feb36c52297d729f14a9a601638`

Constitutional CI run `30651452723` independently reproduced the focused Builder suite and
installed-wheel contract but remanded two static-check defects before Pyright could run:

1. `builder_playbook.py` retained the duplicate-artifact validation result in an unused local
   variable (`F841`); the fix preserves the validation call while removing the unused binding.
2. The Phase 5A/5B compatibility test used two unformatted long local import statements
   (`I001`); the fix formats those imports without changing behavior.

The original failure remains part of the append-only record. No test, contract, evidence, or
authority gate was weakened. A new exact head must pass Ruff, Pyright, the full Python matrix,
CodeQL, dependency/license review, wheel verification, SBOM, and build-evidence upload before
the procedural disposition is terminal.
'''
          if marker not in text:
              court.write_text(text.rstrip() + addition, encoding='utf-8', newline='\n')

          ledger = root / 'evidence/phase5c/PHASE5C_AUDIT_LEDGER.md'
          text = ledger.read_text(encoding='utf-8')
          marker = '## Entry 5 — hosted static-check remand'
          addition = '''

## Entry 5 — hosted static-check remand

- Exact head: `b313fc7d06749feb36c52297d729f14a9a601638`.
- Constitutional CI run: `30651452723`.
- Passed before remand: secret scan; general, Phase 5A, Phase 5B, and Phase 5C installed-wheel
  verification; release integration audit; wheel build; SPDX 2.3 SBOM generation.
- Ruff remands: one unused local binding (`F841`) and one import-format finding (`I001`).
- Repair: preserve duplicate-artifact validation without retaining the unused set; format the
  local compatibility imports.
- Tests, contracts, authority restrictions, evidence requirements, and rollback requirements
  were not weakened.
- Pyright and the final exact-head terminal matrix remain pending on the repaired head.
'''
          if marker not in text:
              ledger.write_text(text.rstrip() + addition, encoding='utf-8', newline='\n')
          PY

          PYTHONPATH=src python scripts/phase5c_builder_inventory.py
          python -m compileall -q src tests scripts
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_phase5c_builder_playbook.py' -v

      - name: Commit the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/hive_mind_os/foundation/builder_playbook.py \
            tests/test_phase5c_builder_playbook.py \
            evidence/courts/phase5c-builder-playbook-court.md \
            evidence/phase5c/PHASE5C_AUDIT_LEDGER.md \
            evidence/phase5c/phase5c_builder_inventory.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'Repair Phase 5C static-check remands'
          git push origin HEAD:agent/phase5c-builder-shadow
