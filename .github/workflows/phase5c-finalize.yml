name: Phase 5C finalize bounded remands

on:
  push:
    branches:
      - agent/phase5c-builder-shadow

permissions:
  contents: write

concurrency:
  group: phase5c-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.ref_name == 'agent/phase5c-builder-shadow'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Apply bounded code, test, and evidence remands
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
                  return
              if new not in text:
                  raise SystemExit(f"missing expected {label} source")

          builder = Path("src/hive_mind_os/foundation/builder_playbook.py")
          replace_once(
              builder,
              '    artifact_ids = set(_unique_ids(artifacts, "artifact_id", "artifact"))\n',
              '    _unique_ids(artifacts, "artifact_id", "artifact")\n',
              "F841 repair",
          )
          replace_once(
              builder,
              '"python -m unittest tests.test_phase5c_builder_playbook.BuilderAdversarialTests"',
              '"python -m unittest tests.test_phase5c_builder_playbook.BuilderOutputAndAdversarialTests"',
              "sample unittest target repair",
          )

          tests = Path("tests/test_phase5c_builder_playbook.py")
          text = tests.read_text(encoding="utf-8")
          import_repairs = {
              '        from hive_mind_os.foundation.architect_playbook_contracts import validate_architect\n': (
                  '        from hive_mind_os.foundation.architect_playbook_contracts import (\n'
                  '            validate_architect,\n'
                  '        )\n'
              ),
              '        from hive_mind_os.foundation.orchestrator_playbook_contracts import validate_orchestrator\n': (
                  '        from hive_mind_os.foundation.orchestrator_playbook_contracts import (\n'
                  '            validate_orchestrator,\n'
                  '        )\n'
              ),
          }
          for old, new in import_repairs.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"missing expected import repair source: {old!r}")

          regression_name = "    def test_example_unittest_targets_resolve(self) -> None:\n"
          if regression_name not in text:
              marker = "    def test_committed_phase5c_inventory_matches_current_tree(self) -> None:\n"
              if marker not in text:
                  raise SystemExit("inventory compatibility test marker is missing")
              regression = (
                  "    def test_example_unittest_targets_resolve(self) -> None:\n"
                  "        request = example_builder_request()\n"
                  "        commands = [\n"
                  "            item[\"command\"]\n"
                  "            for item in request[\"tests\"]\n"
                  "            if item[\"command\"].startswith(\"python -m unittest \")\n"
                  "        ]\n"
                  "        self.assertTrue(commands)\n"
                  "        for command in commands:\n"
                  "            with self.subTest(command=command):\n"
                  "                target = command.removeprefix(\"python -m unittest \")\n"
                  "                module_name, class_name = target.rsplit(\".\", 1)\n"
                  "                self.assertEqual(module_name, \"tests.test_phase5c_builder_playbook\")\n"
                  "                test_case = globals().get(class_name)\n"
                  "                self.assertIsInstance(test_case, type)\n"
                  "                self.assertTrue(issubclass(test_case, unittest.TestCase))\n\n"
              )
              text = text.replace(marker, regression + marker, 1)
          tests.write_text(text, encoding="utf-8", newline="\n")

          court = Path("evidence/courts/phase5c-builder-playbook-court.md")
          text = court.read_text(encoding="utf-8")
          if "## Local command-target and automation-scaffolding remand" not in text:
              text = text.rstrip() + '''

## Local command-target and automation-scaffolding remand

A resumed review found that the sample execution-evidence plan named
`BuilderAdversarialTests`, while the actual focused class is
`BuilderOutputAndAdversarialTests`. The stale target could make a future executor fail before
running the intended hostile and resealing cases even though the direct focused suite was green.
The target was corrected and a compatibility regression now resolves every sample unittest class.

Temporary write-capable repair workflow scaffolding added only to transfer the prior Ruff remand
was not part of the Builder candidate and would contradict the no-runtime/no-authority delivery
boundary if retained. It is removed from the final candidate tree. These repairs do not authorize
execution, weaken tests, or establish authenticated independence.
'''
              court.write_text(text, encoding="utf-8", newline="\n")

          ledger = Path("evidence/phase5c/PHASE5C_AUDIT_LEDGER.md")
          text = ledger.read_text(encoding="utf-8")
          if "## Entry 6 — local command-target and branch-hygiene remand" not in text:
              text = text.rstrip() + '''

## Entry 6 — local command-target and branch-hygiene remand

- Recovered candidate review found one stale sample unittest class target:
  `BuilderAdversarialTests` did not exist.
- Repair: target `BuilderOutputAndAdversarialTests` and add a regression that resolves every
  sample unittest target before publication.
- Branch hygiene: remove temporary write-capable static-remand workflow scaffolding from the
  final candidate tree; it is not product functionality or Builder authority.
- Local result after repair: 67 focused test methods passed.
- No execution, test-result, completion, promotion, activation, value, production, release, or
  superiority authority was added.
'''
              ledger.write_text(text, encoding="utf-8", newline="\n")
          PY

          test ! -e .github/workflows/phase5c-static-remand.yml
          rm .github/workflows/phase5c-finalize.yml
          PYTHONPATH=src python scripts/phase5c_builder_inventory.py
          python -m compileall -q src tests scripts
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_phase5c_builder_playbook.py' -v
          python -m unittest discover -s tests -v

      - name: Commit exact bounded final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/phase5c-finalize.yml \
            src/hive_mind_os/foundation/builder_playbook.py \
            tests/test_phase5c_builder_playbook.py \
            evidence/courts/phase5c-builder-playbook-court.md \
            evidence/phase5c/PHASE5C_AUDIT_LEDGER.md \
            evidence/phase5c/phase5c_builder_inventory.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m 'Finalize Phase 5C remands and remove repair scaffolding'
          git push origin HEAD:agent/phase5c-builder-shadow
