name: PR 117 Merge Diagnostic

on:
  push:
    branches:
      - codex/phase8-exact-candidate-verification
    paths:
      - .github/workflows/pr117-merge-diagnostic.yml

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Reproduce historical Phase-12 receipts
        shell: bash
        run: |
          set -euo pipefail
          candidate=9efe64b80b4bf7b50c7bcf20e9aef5acb8fc55a7
          git worktree add --detach /tmp/pr117-candidate "$candidate"
          cd /tmp/pr117-candidate
          python -m pip install --disable-pip-version-check --no-deps -e . >/tmp/pr117-install.log 2>&1
          mkdir -p /tmp/reproduced-logs

          python -m unittest \
            tests.test_cli_enqueue.EnqueueCliTests.test_enqueue_pins_and_deduplicates_semantic_work \
            -v > /tmp/reproduced-logs/phase11-parity.log 2>&1
          python -m unittest \
            tests.test_cli_enqueue.EnqueueCliTests.test_legacy_rollback_mode_reuses_the_existing_job_without_kernel_writes \
            -v > /tmp/reproduced-logs/phase11-rollback.log 2>&1
          python -m unittest \
            tests.test_brain_kernel_authority \
            tests.test_brain_kernel_local_execution \
            tests.test_sandbox \
            -v > /tmp/reproduced-logs/security-regression.log 2>&1
          python -m unittest discover -s tests -p test_workers.py -v \
            > /tmp/reproduced-logs/recovery-regression.log 2>&1

          echo "=== reproduced transcript digests ==="
          sha256sum /tmp/reproduced-logs/*.log
          echo "=== transcript tails ==="
          for path in /tmp/reproduced-logs/*.log; do
            echo "--- $(basename "$path") ---"
            tail -n 8 "$path"
          done

      - name: Show Ruff fixes without modifying branch
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        continue-on-error: true
        with:
          version: '0.16.0'
          args: 'check --fix --diff examples/verify-an-agent-change/repository/check_discount.py examples/verify-an-agent-change/run_example.py'
