name: Phase 5D materialize bounded candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: phase5d-materialize-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/phase5d-curator-shadow'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Materialize and validate Phase 5D
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .phase5d-payload -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 9
          cat .phase5d-payload/part-* > /tmp/phase5d.b64
          echo "8fcc057223c79bc6932caefc7a0bc5df7ac57e72864a60412f888183c6eabb59  /tmp/phase5d.b64" \
            | sha256sum --check --strict
          base64 --decode /tmp/phase5d.b64 > /tmp/phase5d.tar.gz
          echo "d3bf00a65714a17a154ca47031ae3cc5a4323dca7eddc09cae1f6f73310e3e5b  /tmp/phase5d.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/phase5d.tar.gz --directory .
          python -m pip install --disable-pip-version-check --no-deps -e .
          PYTHONPATH=src:. python scripts/phase5d_materialize.py

      - name: Commit and push validated non-workflow product
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase5d-payload
          git checkout HEAD -- .github/workflows/phase5d-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -e .github/workflows/phase5d-materialize.yml
          test ! -e scripts/phase5d_materialize.py
          test ! -e .phase5d-payload
          git diff --cached --quiet -- .github/workflows/ci.yml
          git diff --cached --quiet -- .github/workflows/phase5d-materialize.yml
          git commit -m 'Add inert Phase 5D Curator deep playbook'
          git push origin HEAD:agent/phase5d-curator-shadow
