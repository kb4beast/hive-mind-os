name: Apply reviewed Phase 5B Architect candidate

on:
  push:
    branches:
      - agent/phase5b-architect-shadow
    paths:
      - .github/bootstrap/phase5b.ready
  pull_request:
    branches:
      - agent/phase5a-orchestrator-shadow
    paths:
      - .github/bootstrap/phase5b.ready

permissions:
  contents: write

concurrency:
  group: phase5b-reviewed-publication
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase5b-architect-shadow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Phase 5B branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase5b-architect-shadow
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and publish reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          sentinel=.github/bootstrap/phase5b.ready
          workflow=.github/workflows/apply-phase5b-reviewed.yml
          chunks=(
            .github/bootstrap/phase5b.part-00
            .github/bootstrap/phase5b.part-01
            .github/bootstrap/phase5b.part-02
            .github/bootstrap/phase5b.part-03
            .github/bootstrap/phase5b.part-04
            .github/bootstrap/phase5b.part-050
            .github/bootstrap/phase5b.part-051
            .github/bootstrap/phase5b.part-060
            .github/bootstrap/phase5b.part-061
            .github/bootstrap/phase5b.part-07
          )
          test -f "$sentinel"
          for chunk in "${chunks[@]}"; do
            test -f "$chunk"
          done
          cat > /tmp/phase5b-chunks.sha256 <<'EOF'
          b85616e65dcb73f3605b0ea5dbc64f5e6d19865de8f4809447fccc177288ba22  .github/bootstrap/phase5b.part-00
          597e39cefd145105fc4a95f6bba28ac7fb89c452d789ed03ad7bc5695f113eb4  .github/bootstrap/phase5b.part-01
          4a15dd011746739e7bef0c373e29de3f91e93f56b9e64cddd3ff1f124e7ba3d5  .github/bootstrap/phase5b.part-02
          f145ca5667fed0750c260faae25d0a84ba85e84d7c94237c37c9ba2a6d970a15  .github/bootstrap/phase5b.part-03
          4e91064f0259e6a72e2ed1626f796da45e1783e13e13b31da081485e8e3b6325  .github/bootstrap/phase5b.part-04
          334c84d1d127f41ed0239566fd21bda98beeaae4574a287bbd87d010f17ea3bb  .github/bootstrap/phase5b.part-050
          8d96a246f181b506cf3e6ea611c7479a57ebd0a151a68be0514cff20c9581ef6  .github/bootstrap/phase5b.part-051
          5253eac363427fe3c84c00075e60ccb01a5bb5cb97ef2d1e16a111574c77284a  .github/bootstrap/phase5b.part-060
          9c9844613a44a94a087c78cefe4addc4019139ef8f0015d56e0200a467a03de1  .github/bootstrap/phase5b.part-061
          39c087eaeea3f94045bba5a05bbbaa645fede3ff38ecfebee6c5098fc720da2c  .github/bootstrap/phase5b.part-07
          EOF
          sha256sum --check --strict /tmp/phase5b-chunks.sha256
          cat "${chunks[@]}" > /tmp/phase5b.patch.gz.b64
          echo 'e4a11998fe9c5212abeaf6ab573fa9586d61b43c1260f98b7b5f58c0e3715fbf  /tmp/phase5b.patch.gz.b64' \
            | sha256sum --check --strict
          base64 --decode /tmp/phase5b.patch.gz.b64 \
            | gzip --decompress > /tmp/phase5b.patch
          echo '77d77a2a87b5c655043c539bd7b779099ca14511b199f36757a25ccb472b1a9c  /tmp/phase5b.patch' \
            | sha256sum --check --strict
          git apply --check --index /tmp/phase5b.patch
          git apply --index /tmp/phase5b.patch
          git rm "${chunks[@]}" "$sentinel" "$workflow"
          git diff --cached --check
          observed_tree="$(git write-tree)"
          test "$observed_tree" = 4ebf4eb700433452c9eff8045e100fd6ec525a67
          git config user.name 'kb4beast'
          git config user.email '14246027+kb4beast@users.noreply.github.com'
          git commit -m 'Add inert Phase 5B Architect deep playbook'
          git push origin HEAD:refs/heads/agent/phase5b-architect-shadow
