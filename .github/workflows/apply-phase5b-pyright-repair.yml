name: Apply Phase 5B hosted Pyright repair

on:
  push:
    branches:
      - agent/phase5b-architect-shadow
    paths:
      - .github/bootstrap/phase5b-pyright.ready
  pull_request:
    branches:
      - agent/phase5a-orchestrator-shadow
    paths:
      - .github/bootstrap/phase5b-pyright.ready

permissions:
  contents: write

concurrency:
  group: phase5b-pyright-repair
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/phase5b-architect-shadow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Phase 5B branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase5b-architect-shadow
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply hosted Pyright repair
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/bootstrap/phase5b-pyright.part-00
          sentinel=.github/bootstrap/phase5b-pyright.ready
          test -f "$payload"
          test -f "$sentinel"
          echo '2cf01ccba1a3d6975a45321dd5a9989cef8f9226b83c1d043bb6aa9d3617863e  .github/bootstrap/phase5b-pyright.part-00' \
            | sha256sum --check --strict
          base64 --decode "$payload" | gzip --decompress > /tmp/phase5b-pyright.patch
          echo '8c8e8ff205c095078750c512562d08797855fc64a30353c0f743d13e731765c7  /tmp/phase5b-pyright.patch' \
            | sha256sum --check --strict
          git apply --check --index /tmp/phase5b-pyright.patch
          git apply --index /tmp/phase5b-pyright.patch
          git rm "$payload" "$sentinel"
          git diff --cached --check
          git config user.name 'kb4beast'
          git config user.email '14246027+kb4beast@users.noreply.github.com'
          git commit -m 'Repair Phase 5B hosted Pyright contract'
          git push origin HEAD:refs/heads/agent/phase5b-architect-shadow
